</style></head><body><header><h1>MONO · Vérification responsive</h1><label>Largeur<select id="width"><option value="320">320 px · petit téléphone</option><option value="390" selected>390 px · téléphone</option><option value="620">620 px · grand téléphone</option><option value="820">820 px · tablette</option><option value="1440">1440 px · ordinateur</option></select></label><label>Parcours<select id="route"><option value="/">Accueil</option><option value="/terra">Terra</option><option value="/codex">Codex</option><option value="/univers">Univers</option><option value="/powerscaling">Pouvoirs</option><option value="/lire/livre-1/1">Lecture</option><option value="/fiche/qerath">Fiche</option><option value="/chronologie">Âges</option><option value="/chercher">Recherche</option></select></label><a id="open" target="_blank" rel="noopener">Ouvrir le site</a></header><p>Le site fonctionne dans une fenêtre à la largeur choisie. Les thèmes, menus, filtres et agrandissements sont interactifs.</p><div class="workspace"><iframe id="preview" title="MONO à la largeur choisie"></iframe></div><script>
